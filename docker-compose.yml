version: '3.8'

services:
  backend:
    build: 
      context: ./backend-unified
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://medical_ai:medical_ai_password@db:5432/medical_ai
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production-2024}
      - LLM_ENABLED=True
      - ML_ENABLED=True
      - LLM_MODEL_PATH=/app/models/phi-3-mini-4k-instruct-q4.gguf
      - MAX_RAM_USAGE_GB=6.5
    depends_on:
      - db
      - redis
    volumes:
      - ./backend-unified:/app
      - ./models:/app/models
      - ./backend-unified/models:/app/backend-unified/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=medical_ai
      - POSTGRES_USER=medical_ai
      - POSTGRES_PASSWORD=medical_ai_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production-2024}
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  medical_ai_db:
